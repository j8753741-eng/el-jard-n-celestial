<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Jardín Celestial</title>

<style>

body{
    margin:0;
    background: radial-gradient(circle at top, #1a0b2e, black);
    color:white;
    font-family:Arial;
    overflow:hidden;
}

.center{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
}

h1{
    color:#ffd700;
    font-size:2rem;
}

p{
    color:#c9a7ff;
    max-width:500px;
}

.floating{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:gold;
    border-radius:50%;
    animation:float 6s linear infinite;
}

@keyframes float{
    from{transform:translateY(100vh); opacity:1;}
    to{transform:translateY(-10vh); opacity:0;}
}

</style>

</head>

<body>

<div class="floating" id="particles"></div>

<div class="center">

    <h1>Bienvenida al Jardín Celestial</h1>

    <p>
        Aquí comienza el lugar donde el tiempo se detiene,
        donde los recuerdos florecen
        y donde tú eres la razón de todo.
    </p>

</div>

<script>

const container = document.getElementById("particles");

for(let i=0;i<40;i++){

    const p = document.createElement("div");
    p.classList.add("particle");

    p.style.left = Math.random()*100 + "vw";
    p.style.animationDuration = (3 + Math.random()*5) + "s";
    p.style.opacity = Math.random();

    container.appendChild(p);
}

</script>

</body>
</html>
