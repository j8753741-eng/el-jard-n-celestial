<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Jardín Celestial</title>

<style>

body{
    margin:0;
    background: radial-gradient(circle at top, #1a0b2e, black);
    color:white;
    font-family:Arial;
    overflow:hidden;
}

.center{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
}

h1{
    color:#ffd700;
    font-size:2rem;
}

p{
    color:#c9a7ff;
    max-width:500px;
}

.floating{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:gold;
    border-radius:50%;
    animation:float 6s linear infinite;
}

@keyframes float{
    from{transform:translateY(100vh); opacity:1;}
    to{transform:translateY(-10vh); opacity:0;}
}

    .tree{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(4, 60px);
    gap:15px;
    justify-content:center;
}

.leaf{
    font-size:40px;
    cursor:pointer;
    transition:0.3s;
    filter:drop-shadow(0 0 5px gold);
}

.leaf:hover{
    transform:scale(1.3);
}

#memoryBox{
    margin-top:25px;
    padding:15px;
    border:1px solid gold;
    border-radius:15px;
    min-height:60px;
    color:#ffd700;
    max-width:400px;
}
    .lake-section{
    margin-top:60px;
    text-align:center;
}

.lake{
    width:220px;
    height:220px;
    margin:20px auto;
    border-radius:50%;
    background: radial-gradient(circle at center, #1a0b2e, #000);
    border:2px solid gold;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 0 25px rgba(255,215,0,0.3);
}

.ripple{
    position:absolute;
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid gold;
    animation:ripple 1.2s ease-out forwards;
}

@keyframes ripple{
    from{
        transform:scale(1);
        opacity:1;
    }
    to{
        transform:scale(10);
        opacity:0;
    }
}

#wishText{
    margin-top:20px;
    color:#ffd700;
    max-width:400px;
    margin-left:auto;
    margin-right:auto;
} 
    .flowers-section{
    margin-top:60px;
    text-align:center;
}

.flowers{
    display:grid;
    grid-template-columns:repeat(4,60px);
    gap:15px;
    justify-content:center;
    margin-top:20px;
}

.flower{
    font-size:40px;
    cursor:pointer;
    transition:0.3s;
    filter:drop-shadow(0 0 6px #ffccff);
}

.flower:hover{
    transform:scale(1.3) rotate(10deg);
}

#flowerText{
    margin-top:20px;
    color:#ffd700;
    max-width:420px;
    margin-left:auto;
    margin-right:auto;
}
</style>

</head>

<body>

<div class="floating" id="particles"></div>

<div class="center">

    <h1>El Árbol de nuestros recuerdos</h1>

    <p>Haz clic en cada hoja para recordar nuestro camino 🌙</p>

    <div class="tree">

        <div class="leaf" onclick="showMemory('1')">🍃</div>
        <div class="leaf" onclick="showMemory('2')">🍃</div>
        <div class="leaf" onclick="showMemory('3')">🍃</div>
        <div class="leaf" onclick="showMemory('4')">🍃</div>
        <div class="leaf" onclick="showMemory('5')">🍃</div>
        <div class="leaf" onclick="showMemory('6')">🍃</div>
        <div class="leaf" onclick="showMemory('7')">🍃</div>
        <div class="leaf" onclick="showMemory('8')">🍃</div>

    </div>

    <div id="memoryBox"></div>

</div>
<div class="lake-section">

    <h2>El Lago de los Deseos</h2>

    <p>Toca el agua… y deja que el jardín escuche tu corazón 🌊</p>

    <div class="lake" id="lake"></div>

    <div id="wishText"></div>

</div>
<div class="flowers-section">

    <h2>Las Ocho Flores del Amor</h2>

    <p>Cada flor guarda una parte de nuestra historia 🌸</p>

    <div class="flowers">

        <div class="flower" onclick="showFlower(1)">🌸</div>
        <div class="flower" onclick="showFlower(2)">🌸</div>
        <div class="flower" onclick="showFlower(3)">🌸</div>
        <div class="flower" onclick="showFlower(4)">🌸</div>
        <div class="flower" onclick="showFlower(5)">🌸</div>
        <div class="flower" onclick="showFlower(6)">🌸</div>
        <div class="flower" onclick="showFlower(7)">🌸</div>
        <div class="flower" onclick="showFlower(8)">🌸</div>

    </div>

    <div id="flowerText"></div>

</div> 
<script>

function showMemory(id){

    const memories = {
        1: "Mes 1: Cuando todo empezó a sentirse especial contigo 💜",
        2: "Mes 2: Descubrimos que hablar contigo era mi parte favorita del día 🌙",
        3: "Mes 3: Ya no eras solo alguien… eras mi persona ✨",
        4: "Mes 4: Cada momento contigo empezaba a sentirse hogar 🏡",
        5: "Mes 5: Me di cuenta de que te elegía sin pensarlo 💫",
        6: "Mes 6: Ya eras parte de mis planes sin darte cuenta 🌸",
        7: "Mes 7: El amor contigo dejó de ser duda y se volvió certeza 💛",
        8: "Mes 8: Y aquí estamos… construyendo algo que quiero para siempre 🌌"
    };

    document.getElementById("memoryBox").innerText = memories[id];

}

const lake = document.getElementById("lake");
const wishText = document.getElementById("wishText");

let clickCount = 0;

const wishes = [
    "El jardín escucha tu corazón...",
    "Cada deseo que nace aquí florece en el universo ✨",
    "Este lugar guarda todo lo que no dijimos en palabras 💜",
    "Si el amor tiene forma, es este momento 🌙",
    "Tu deseo ha sido recibido entre estrellas doradas 🌌"
];

lake.addEventListener("click", (e) => {

    clickCount++;

    const ripple = document.createElement("div");
    ripple.classList.add("ripple");

    ripple.style.left = e.offsetX + "px";
    ripple.style.top = e.offsetY + "px";

    lake.appendChild(ripple);

    setTimeout(() => {
        ripple.remove();
    }, 1200);

    if(clickCount <= wishes.length){
        wishText.innerText = wishes[clickCount - 1];
    } else {
        wishText.innerText = "El jardín ya ha escuchado todos tus deseos 💛";
    }

});

function showFlower(id){

    const flowers = {
        1: "Mes 1 🌸: Todo comenzó sin saber lo importante que serías en mi vida",
        2: "Mes 2 🌸: Empezaste a ser mi pensamiento favorito del día",
        3: "Mes 3 🌸: Ya no eras una opción… eras una certeza",
        4: "Mes 4 🌸: Contigo descubrí lo que significa tranquilidad",
        5: "Mes 5 🌸: El amor contigo dejó de ser miedo y se volvió hogar",
        6: "Mes 6 🌸: Empecé a imaginarte en todos mis futuros",
        7: "Mes 7 🌸: Ya no era costumbre… era amor consciente",
        8: "Mes 8 🌸: Y aquí estamos… eligiéndonos sin dudarlo 🌙💜"
    };

    const text = document.getElementById("flowerText");

    text.innerText = flowers[id];

}

    </script>
</body>
</html>
