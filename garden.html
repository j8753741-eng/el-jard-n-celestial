<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Jardín Celestial - Fase 3</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background: radial-gradient(circle at top, #1a0b2e, #000);
    color:white;
    overflow-x:hidden;
}

/* título */
h1,p{
    text-align:center;
}

/* árbol */
.tree{
    display:grid;
    grid-template-columns:repeat(4,70px);
    gap:15px;
    justify-content:center;
    margin-top:40px;
}

.leaf{
    font-size:42px;
    cursor:pointer;
    transition:0.3s;
    filter:drop-shadow(0 0 6px gold);
}

.leaf:hover{
    transform:scale(1.3);
}

/* caja de texto */
#memoryBox{
    margin-top:30px;
    text-align:center;
    color:#ffd700;
    max-width:420px;
    margin-left:auto;
    margin-right:auto;
    padding:10px;
    min-height:60px;
}

</style>

</head>

<body>

<h1>El Jardín Celestial</h1>

<p>🌳 Árbol de los Gracias</p>

<div class="tree">

<div class="leaf" onclick="memory(1)">🍃</div>
<div class="leaf" onclick="memory(2)">🍃</div>
<div class="leaf" onclick="memory(3)">🍃</div>
<div class="leaf" onclick="memory(4)">🍃</div>
<div class="leaf" onclick="memory(5)">🍃</div>
<div class="leaf" onclick="memory(6)">🍃</div>
<div class="leaf" onclick="memory(7)">🍃</div>
<div class="leaf" onclick="memory(8)">🍃</div>

</div>

<div id="memoryBox"></div>

<script>

function memory(i){

const m = [
"Mes 1 💜: sin saberlo, ya eras importante",
"Mes 2 🌙: hablar contigo era mi momento favorito",
"Mes 3 ✨: ya te pensaba sin darme cuenta",
"Mes 4 🏡: contigo todo se sentía hogar",
"Mes 5 💫: empezabas a ser indispensable",
"Mes 6 🌸: ya eras parte de mis planes",
"Mes 7 💛: entendí lo que sentía",
"Mes 8 🌌: y aquí seguimos… creciendo juntos"
];

document.getElementById("memoryBox").innerText = m[i-1];

}

</script>

</body>
</html>
